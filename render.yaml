services:
  - type: web
    name: studyvault-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: studyvault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/studyvault.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: studyvault-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false

  - type: web
    name: studyvault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: studyvault-api
          envVarKey: RENDER_EXTERNAL_URL
